0}.tabs .selected{color:#fff;background:#3c3050}.search{min-width:220px;background:#151928;border:1px solid var(--edge);padding:11px 14px;border-radius:12px;color:#fff;outline:0}.search:focus{border-color:var(--accent)}.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:14px}.chip{white-space:nowrap;color:#9aa1b3;border:1px solid var(--edge);background:#141724;border-radius:999px;padding:6px 12px;font-size:12px}.chip.on{background:#3b2c4c;color:#e6d2ff;border-color:#76558e}.collection{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:14px}.item{background:var(--panel);border:1px solid #ffffff13;border-radius:17px;overflow:hidden;text-align:left;color:inherit;padding:0;transition:transform .15s,border-color .15s}.item:hover{transform:translateY(-3px);border-color:#8768b7}.art{height:132px;background:radial-gradient(circle at 70% 15%,#ffffff2f,transparent 50%),linear-gradient(145deg,var(--a),var(--b));display:flex;justify-content:space-between;padding:13px;position:relative;overflow:hidden}.art:after{content:attr(data-initial);position:absolute;right:-8px;bottom:-35px;font-size:122px;font-weight:950;opacity:.15;transform:rotate(-12deg)}.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.pill{align-self:start;position:relative;z-index:1;border:1px solid #ffffff30;background:#121422c9;backdrop-filter:blur(10px);padding:3px 9px;border-radius:8px;font-size:11px;font-weight:800}.type{align-self:end;position:relative;z-index:1;background:#121422bc;padding:3px 8px;border-radius:7px;font-size:11px}.details{padding:13px}.details h3{font-size:15px;line-height:1.35;margin:0 0 9px;min-height:40px}.details .sub{font-size:12px;color:var(--muted)}.details .progress{margin:12px 0 0}.empty{border:1px dashed var(--edge);border-radius:15px;padding:45px 24px;text-align:center;color:var(--muted);grid-column:1/-1}.shade{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(7px)}.dialog{width:min(100%,540px);max-height:min(90vh,780px);overflow:auto;background:#191b2a;border:1px solid #454056;border-radius:22px;padding:25px;box-shadow:0 24px 90px #0009}.dialog h2{font-size:25px;line-height:1.2;margin:6px 0 18px}.dialogtop{display:flex;align-items:center;justify-content:space-between;gap:10px}.close{background:transparent;border:0;color:#c7c3d4;font-size:26px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field.wide{grid-column:1/-1}.field label{color:#c8c9d5;font-size:12px;font-weight:700}.field input,.field select{background:#0f1220;color:#f3f3fb;border:1px solid #34394c;border-radius:10px;padding:11px 12px;width:100%;min-width:0;outline:none}.field input:focus,.field select:focus{border-color:var(--accent)}.dialogactions{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #ffffff18;padding-top:18px;margin-top:9px}.hint{color:var(--muted);font-size:12px}.settingcard{border:1px solid var(--edge);padding:17px;border-radius:14px;margin:12px 0;background:#141725}.settingcard h3{margin:0 0 6px;font-size:16px}.settingcard p{color:var(--muted);font-size:13px;margin:0 0 12px}.syncstate{font-size:12px;color:var(--muted);margin-top:12px}.toast{position:fixed;bottom:28px;right:24px;z-index:80;padding:12px 18px;background:#322442;color:#fff;border:1px solid #765d94;border-radius:12px;box-shadow:0 10px 40px #0009}.mobilebar{display:none}.sr{position:absolute;left:-9999px}.hide{display:none!important}@media(max-width:950px){.shell{grid-template-columns:1fr}.side{display:none}.content{padding:28px 20px 100px}.continuing{grid-template-columns:repeat(2,minmax(0,1fr))}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;justify-content:space-around;background:#111320ef;backdrop-filter:blur(20px);border-top:1px solid #ffffff21;padding:9px 0 calc(8px + env(safe-area-inset-bottom))}.mobilebar button{background:transparent;border:0;color:#8e91a5;font-weight:700;display:grid;justify-items:center;gap:2px;font-size:10px;min-width:60px}.mobilebar button.active{color:var(--accent)}.mobilebar svg{width:22px;height:22px}}@media(max-width:590px){.content{padding:24px 16px 100px}.topline{align-items:center}.title{font-size:34px}.subtitle{font-size:13px}.topline .actions .btn.ghost{display:none}.stats{grid-template-columns:repeat(2,1fr);margin:22px 0;gap:9px}.stat{padding:14px}.stat b{font-size:27px}.continuing{grid-template-columns:1fr}.current{min-height:140px}.collection{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.art{height:126px}.details{padding:11px}.details h3{font-size:13px;min-height:37px}.filters{margin-top:14px}.tabs{width:100%;justify-content:space-between}.tabs button{flex:1}.search{width:100%}.formgrid{gap:10px}.dialog{padding:19px}.sectionhead{margin:22px 0 12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div class="shell"><aside class="side"><div><div class="logo">KIZU<span>NA.</span></div><div class="brandline">YOUR STORY UNIVERSE</div></div><nav class="nav" id="desktopnav"></nav><div class="sidefoot">Made for your anime era. ✦<br><span id="sidestatus">Lokal gespeichert</span></div></aside><main class="content"><header class="topline"><div><div class="eyebrow">YOUR PERSONAL ARCHIVE ✦</div><h1 class="title" id="pageTitle">Deine Collection.</h1><p class="subtitle" id="subtitle">Jede Story. Jeder Fortschritt. Dein Universum.</p></div><div class="actions"><button class="btn ghost" id="settingsButton">⚙ Settings</button><button class="btn primary" id="addButton">＋ Hinzufügen</button></div></header><div id="main"></div></main></div><nav class="mobilebar" id="mobilenav"></nav><div id="modal"></div><div id="toastzone" role="status" aria-live="polite"></div><input class="hide" type="file" id="importFile" accept="application/json,.json">
<script type="module">
const K='kizuna-v1';
// Trage deine drei Supabase-Werte ein. Nur Publishable Key, NIEMALS einen Secret Key.
const CONFIG={url:'DEINE_SUPABASE_PROJEKT_URL',key:'DEIN_SB_PUBLISHABLE_KEY',adminId:'DEINE_ADMIN_USER_UUID'};
const configured=()=>/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(CONFIG.url)&&/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(CONFIG.adminId)&&CONFIG.key.startsWith('sb_publishable_');
const icons={all:'▦',anime:'▶',manga:'▤',active:'◷',settings:'⚙'};
const statusNames={watching:'Am Schauen',reading:'Am Lesen',completed:'Abgeschlossen',planned:'Geplant',paused:'Pausiert',dropped:'Abgebrochen'};
const statusShort={watching:'Aktiv',reading:'Aktiv',completed:'Fertig',planned:'Plan',paused:'Pause',dropped:'Drop'};
const palettes=[['#534c9b','#271739'],['#275a74','#152a48'],['#ba654c','#3e2440'],['#367868','#163b4c'],['#865b96','#30204a'],['#927445','#463149'],['#a44d79','#371c3b'],['#505aa3','#172a44']];
const titles=['Naruto Classic','Naruto Shippuden','Naruto: The Last','Attack on Titan','Boruto','Vinland Saga','Blue Lock','Dragon Ball Z','Dragon Ball Super','Dragon Ball Super: Broly','Dragon Ball Daima','Demon Slayer','Chainsaw Man','Baki','Death Note','Solo Leveling','One Piece','One Piece: Stampede','One Piece: Fan Letter','Jujutsu Kaisen','Jujutsu Kaisen 0','The Promised Neverland','Kaiju No. 8','Sakamoto Days','One Punch Man','Hell’s Paradise','Erased','Super Cube','A Silent Voice','My Hero Academia','86: Eighty-Six','Bleach','Bleach: Thousand-Year Blood War','Gachiakuta','Takopi’s Original Sin','Dr. Stone','Mob Psycho 100','Hajime no Ippo','Howl’s Moving Castle','Spirited Away','100 Meters','Gurren Lagann','Death Parade','Rainbow','Dororo','Steins;Gate','Princess Mononoke','Grave of the Fireflies','Samurai Champloo'];
function seed(){let a=titles.map((name,i)=>({id:crypto.randomUUID(),name,type:'anime',status:i>=41?'planned':'completed',progress:0,total:0,note:'',cover:'',updated:Date.now()-i*1000}));function change(n,p){const x=a.find(v=>v.name===n);if(x)Object.assign(x,p)}change('One Piece',{status:'watching',progress:1170,total:1195});change('Bleach',{status:'watching',progress:142});change('Gachiakuta',{status:'watching',progress:7});change('Baki',{status:'dropped',note:'Abgebrochen / gequittet'});change('Bleach: Thousand-Year Blood War',{status:'planned'});a.push({id:crypto.randomUUID(),name:'Blue Lock',type:'manga',status:'reading',progress:338,total:0,note:'',cover:'',updated:Date.now()},{id:crypto.randomUUID(),name:'Vagabond',type:'manga',status:'reading',progress:87,total:0,note:'',cover:'',updated:Date.now()});return a}
let data;try{const d=JSON.parse(localStorage.getItem(K));data=Array.isArray(d)?d:seed()}catch{data=seed()}
if(configured())data=[];
let tab='all',filter='all',query='',modal=null,cloud=null,supabase=null,saveTimer=null,syncing=false,initialized=false,published=false;
const isAdmin=()=>!!cloud?.user&&cloud.user.id===CONFIG.adminId;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(sync=true){if(!isAdmin())return;localStorage.setItem(K,JSON.stringify(data));if(sync&&supabase){clearTimeout(saveTimer);saveTimer=setTimeout(pushCloud,500)}}
function toast(msg){$('#toastzone').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toastzone').replaceChildren(),3500)}
const iconSvg=name=>({all:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',anime:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/>',manga:'<path d="M12 6c-3-3-6-3-9-2v15c4-1 7 0 9 2 2-2 5-3 9-2V4c-3-1-6-1-9 2z"/><path d="M12 6v15"/>',active:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',settings:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>'}[name]||'').replace(/^/, '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">')+'</svg>';
function nav(){for(const target of ['#desktopnav','#mobilenav'])$(target).innerHTML=[['all','Übersicht'],['anime','Anime'],['manga','Manga'],['active','In Progress'],['settings','Settings']].map(([t,n])=>`<button class="${tab===t?'active':''}" data-nav="${t}">${iconSvg(t)}<span>${n}</span></button>`).join('')}
function bar(x){return x.total>0?Math.min(100,Math.floor(x.progress/x.total*100)):0}function color(x){let v=0;for(const c of x.name)v+=c.charCodeAt(0);return palettes[v%palettes.length]}function item(x){const [a,b]=color(x),metric=x.type==='manga'?'Kapitel':'Episode',status=x.status==='completed'?'Fertig':statusShort[x.status],label=x.progress?`${metric} ${x.progress}${x.total?' / '+x.total:''}`:statusNames[x.status];return `<button class="item" data-edit="${x.id}"><div class="art" data-initial="${esc(x.name.slice(0,1).toUpperCase())}" style="--a:${a};--b:${b}">${x.cover?`<img alt="" loading="lazy" src="${esc(x.cover)}" onerror="this.style.display='none'">`:''}<span class="pill">${esc(status)}</span><span class="type">${x.type==='anime'?'ANIME':'MANGA'}</span></div><div class="details"><h3>${esc(x.name)}</h3><div class="sub">${esc(label)}</div>${x.total&&x.progress?`<div class="progress"><div class="bar" style="width:${bar(x)}%"></div></div>`:''}</div></button>`}
function current(x){const [a,b]=color(x);return `<div class="current"><div class="currenttop"><div><small>${x.type==='anime'?'ANIME':'MANGA'} • ${esc(statusNames[x.status])}</small><h3>${esc(x.name)}</h3></div><div class="covermini" style="--a:${a};--b:${b}">${esc(x.name[0])}</div></div><div><div class="progressrow"><span>${x.type==='anime'?'Episode':'Kapitel'} ${x.progress}${x.total?' / '+x.total:''}</span>${isAdmin()?`<button aria-label="Fortschritt um eins erhöhen" class="increment" data-plus="${x.id}">＋ 1</button>`:''}</div>${x.total?`<div class="progress"><div class="bar" style="width:${bar(x)}%"></div></div>`:''}</div></div>`}
function render(){nav();const isSettings=tab==='settings',sub={all:['Deine Collection.','Jede Story. Jeder Fortschritt. Dein Universum.'],anime:['Anime Library.','Alle Serien und Filme auf einen Blick.'],manga:['Manga Library.','Dein Lesefortschritt – getrennt vom Anime.'],active:['Dein Fortschritt.','Direkt dort weitermachen, wo du aufgehört hast.'],settings:['Deine Einstellungen.','Backup und Cloud-Synchronisierung.']}[tab];$('#pageTitle').textContent=sub[0];$('#subtitle').textContent=sub[1];$('#settingsButton').classList.toggle('hide',isSettings);$('#addButton').classList.toggle('hide',isSettings||!isAdmin());if(isSettings){renderSettings();return}const active=data.filter(x=>['watching','reading'].includes(x.status)).sort((a,b)=>b.updated-a.updated);let list=data.filter(x=>tab==='all'||tab==='active'&&active.includes(x)||x.type===tab);if(filter!=='all')list=list.filter(x=>x.status===filter);if(query.trim())list=list.filter(x=>x.name.toLocaleLowerCase().includes(query.trim().toLocaleLowerCase()));list.sort((a,b)=>{const weight=s=>({watching:0,reading:0,paused:1,planned:2,completed:3,dropped:4}[s]??5);return weight(a.status)-weight(b.status)||a.name.localeCompare(b.name,'de')});const completed=data.filter(x=>x.status==='completed').length,planned=data.filter(x=>x.status==='planned').length,dropped=data.filter(x=>x.status==='dropped').length;$('#main').innerHTML=`${tab==='all'?`<div class="stats"><div class="stat"><small>In deiner Library</small><b>${data.length}</b></div><div class="stat"><small>Abgeschlossen</small><b>${completed}</b></div><div class="stat"><small>Auf deiner Watchlist</small><b>${planned}</b></div><div class="stat"><small>Abgebrochen</small><b>${dropped}</b></div></div>${active.length?`<div class="sectionhead"><h2>✦ Gerade dabei</h2><small>${active.length} laufend</small></div><div class="continuing">${active.slice(0,3).map(current).join('')}</div>`:''}`:''}<div class="sectionhead"><h2>${tab==='active'?'Aktuelle Serien & Manga':'Deine Library'}</h2><small>${list.length} Titel</small></div><div class="filters"><div class="tabs"><button data-tab="all" class="${tab==='all'?'selected':''}">Alle</button><button data-tab="anime" class="${tab==='anime'?'selected':''}">Anime</button><button data-tab="manga" class="${tab==='manga'?'selected':''}">Manga</button></div><input class="search" id="search" placeholder="⌕  Titel suchen ..." aria-label="Titel suchen" value="${esc(query)}"></div><div class="chips">${[['all','Alle'],['watching','Am Schauen'],['reading','Am Lesen'],['completed','Fertig'],['planned','Geplant'],['paused','Pausiert'],['dropped','Abgebrochen']].map(([s,n])=>`<button class="chip ${filter===s?'on':''}" data-filter="${s}">${n}</button>`).join('')}</div><div class="collection">${list.length?list.map(item).join(''):'<div class="empty">Keine Titel gefunden. Passe deine Filter an oder füge etwas Neues hinzu.</div>'}</div>`}
function openEditor(id){if(!isAdmin()){toast('Nur der Admin darf bearbeiten');return;}const x=data.find(v=>v.id===id)||{id:'',name:'',type:tab==='manga'?'manga':'anime',status:'planned',progress:0,total:0,note:'',cover:''};modal=x.id||'new';$('#modal').innerHTML=`<div class="shade" id="shade"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><div class="dialogtop"><span class="eyebrow">${x.id?'EDIT ENTRY':'NEW STORY'}</span><button class="close" id="closeModal" aria-label="Schliessen">×</button></div><h2 id="dialogtitle">${x.id?esc(x.name):'Titel hinzufügen'}</h2><form id="entryForm"><div class="formgrid"><div class="field wide"><label for="fieldName">Titel</label><input id="fieldName" required maxlength="120" value="${esc(x.name)}" placeholder="z. B. Frieren"></div><div class="field"><label for="fieldType">Medium</label><select id="fieldType"><option value="anime" ${x.type==='anime'?'selected':''}>Anime</option><option value="manga" ${x.type==='manga'?'selected':''}>Manga</option></select></div><div class="field"><label for="fieldStatus">Status</label><select id="fieldStatus">${Object.entries(statusNames).map(([s,n])=>`<option value="${s}" ${s===x.status?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label for="fieldProgress">Aktuelle Episode / Kapitel</label><input id="fieldProgress" type="number" inputmode="numeric" min="0" max="999999" value="${x.progress}"></div><div class="field"><label for="fieldTotal">Gesamt (optional)</label><input id="fieldTotal" type="number" inputmode="numeric" min="0" max="999999" value="${x.total||''}" placeholder="Unbekannt"></div><div class="field wide"><label for="fieldNote">Notiz (optional)</label><input id="fieldNote" maxlength="500" value="${esc(x.note)}" placeholder="Meine Gedanken ..."></div><div class="field wide"><label for="fieldCover">Cover-Bild-URL (optional)</label><input id="fieldCover" type="url" value="${esc(x.cover)}" placeholder="https://..."></div></div><div class="dialogactions"><div>${x.id?'<button class="btn ghost" type="button" id="deleteEntry" style="color:var(--red)">Löschen</button>':''}</div><button class="btn primary" type="submit">Speichern ↗</button></div></form></div></div>`;$('#fieldName').focus()}
function closeModal(){modal=null;$('#modal').replaceChildren()}
function renderSettings(){
 const admin=isAdmin(),signed=!!cloud?.user;
 $('#main').innerHTML=`<div class="sectionhead"><h2>KIZUNA Cloud</h2></div>
 <div class="settingcard"><h3>${admin?'👑 Admin angemeldet':signed?'⚠ Kein Admin-Account':'👁 Öffentliche Sammlung'}</h3>
 <p>${admin?'Du kannst deine Sammlung bearbeiten und für alle veröffentlichen.':signed?'Dieses Konto besitzt keine Schreibrechte.':'Besucher können deine veröffentlichte Library anschauen. Nur der Admin darf Änderungen speichern.'}</p>
 ${admin?`<button class="btn primary" id="publishLocal">Lokale MacBook-Liste veröffentlichen</button> <button class="btn" id="signOut">Abmelden</button>`:signed?`<button class="btn" id="signOut">Abmelden</button>`:`<button class="btn primary" id="adminLogin">Admin-Login</button>`}
 <p class="syncstate" id="syncstate">${configured()?(published?'Cloud-Sammlung geladen':'Noch keine veröffentlichte Sammlung vorhanden'):'Supabase-Konfiguration fehlt in index.html'}</p></div>
 ${admin?`<div class="settingcard"><h3>⬇ Backup exportieren</h3><p>Deine lokale Collection als JSON sichern.</p><button class="btn" id="export">Backup herunterladen</button></div><div class="settingcard"><h3>⬆ Backup importieren</h3><p>JSON-Backup importieren und danach in der Cloud speichern.</p><button class="btn" id="import">Backup importieren</button></div>`:''}`;
}
function exportData(){const blob=new Blob([JSON.stringify({app:'kizuna',version:1,exportedAt:new Date().toISOString(),entries:data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`kizuna-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Backup erstellt')}
function validateEntries(v){if(!Array.isArray(v)||v.length>10000)throw Error('Ungültige Collection');return v.map(x=>{if(typeof x.name!=='string'||!x.name.trim()||!['anime','manga'].includes(x.type))throw Error('Ungültiger Titel');return {id:String(x.id||crypto.randomUUID()),name:x.name.slice(0,120),type:x.type,status:statusNames[x.status]?x.status:'planned',progress:Math.max(0,Math.min(999999,Number(x.progress)||0)),total:Math.max(0,Math.min(999999,Number(x.total)||0)),note:String(x.note||'').slice(0,500),cover:/^https:\/\//.test(x.cover||'')?String(x.cover):'',updated:Number(x.updated)||Date.now()}})}
async function loadSupabase(){
 if(!configured()){$('#sidestatus').textContent='Konfiguration fehlt';render();return;}
 const m=await import('https://esm.sh/@supabase/supabase-js@2.49.4');
 supabase=m.createClient(CONFIG.url,CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const {data:session,error}=await supabase.auth.getSession();if(error)throw error;
 cloud={user:session.session?.user||null};
 supabase.auth.onAuthStateChange((_event,ss)=>{const before=isAdmin();cloud={user:ss?.user||null};if(before!==isAdmin())setTimeout(()=>refreshCloud(),0);else render();});
 await refreshCloud();
}
async function refreshCloud(){
 if(!supabase)return;
 try{
 const {data:row,error}=await supabase.from('collections').select('entries').eq('user_id',CONFIG.adminId).maybeSingle();
 if(error)throw error;
 if(row){data=validateEntries(row.entries);published=true;$('#sidestatus').textContent=isAdmin()?'Admin · Cloud':'Öffentliche Library';}
 else {published=false;$('#sidestatus').textContent='Noch nicht veröffentlicht';if(!isAdmin())data=[];}
 render();
 }catch(e){$('#sidestatus').textContent='Cloud-Fehler';toast('Cloud-Laden: '+e.message);render()}
}
async function pushCloud(){
 if(!isAdmin()||!supabase)return;
 try{const {error}=await supabase.from('collections').upsert({user_id:CONFIG.adminId,entries:data,updated_at:new Date().toISOString()},{onConflict:'user_id'});
 if(error)throw error;published=true;$('#sidestatus').textContent='Cloud synchronisiert';if($('#syncstate'))$('#syncstate').textContent='✓ Online gespeichert';
 }catch(e){toast('Speichern fehlgeschlagen: '+e.message);$('#sidestatus').textContent='Sync fehlgeschlagen'}
}
function showLogin(){
 $('#modal').innerHTML=`<div class="shade"><div class="dialog" role="dialog" aria-modal="true"><div class="dialogtop"><span class="eyebrow">ADMIN ONLY</span><button class="close" id="closeModal">×</button></div><h2>Admin anmelden</h2><form id="loginForm"><div class="field"><label>E-Mail</label><input required id="loginEmail" type="email" autocomplete="email"></div><div class="field"><label>Passwort</label><input required id="loginPassword" type="password" autocomplete="current-password"></div><button class="btn primary" type="submit">Anmelden</button></form><p class="hint" id="loginMessage"></p></div></div>`;
}
async function init(){nav();render();try{await loadSupabase()}catch(e){console.warn(e);toast('Supabase-Verbindung fehlgeschlagen: '+e.message)}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){tab=b.dataset.nav;filter='all';query='';render()}else if(b.dataset.tab){tab=b.dataset.tab;filter='all';render()}else if(b.dataset.filter){filter=b.dataset.filter;render()}else if(b.dataset.edit){if(isAdmin())openEditor(b.dataset.edit);else toast('Nur lesbar · Admin-Login unter Settings')}else if(b.dataset.plus){if(!isAdmin())return;const x=data.find(v=>v.id===b.dataset.plus);if(x){x.progress++;x.updated=Date.now();persist();render();toast(`${x.name}: ${x.progress}`)}}else if(b.id==='settingsButton'){tab='settings';render()}else if(b.id==='addButton'){openEditor()}else if(b.id==='closeModal'){closeModal()}else if(b.id==='deleteEntry'){if(!isAdmin())return;const x=data.find(v=>v.id===modal);if(x&&confirm(`${x.name} wirklich löschen?`)){data=data.filter(v=>v.id!==x.id);persist();closeModal();render();toast('Titel gelöscht')}}else if(b.id==='export'&&isAdmin())exportData();else if(b.id==='import'&&isAdmin())$('#importFile').click();else if(b.id==='adminLogin')showLogin();else if(b.id==='publishLocal'&&isAdmin()){if(confirm('Deine lokal gespeicherte Liste jetzt veröffentlichen? Dies überschreibt die Cloud-Library für alle Besucher.')){try{const local=JSON.parse(localStorage.getItem(K)||'[]');if(!Array.isArray(local)||!local.length)throw Error('Kein lokales Backup gefunden');data=validateEntries(local);await pushCloud();render();toast('Deine Library ist jetzt öffentlich!')}catch(err){toast(err.message)}}}else if(b.id==='signOut'){if(supabase)await supabase.auth.signOut();cloud={user:null};closeModal();await refreshCloud();toast('Abgemeldet')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;query=e.target.value;render();const s=$('#search');s?.focus();s?.setSelectionRange(pos,pos)}});
document.addEventListener('submit',async e=>{if(e.target.id==='entryForm'){e.preventDefault();if(!isAdmin())return;const v=id=>$('#'+id).value;const entry={id:modal==='new'?crypto.randomUUID():modal,name:v('fieldName').trim(),type:v('fieldType'),status:v('fieldStatus'),progress:Number(v('fieldProgress'))||0,total:Number(v('fieldTotal'))||0,note:v('fieldNote').trim(),cover:v('fieldCover').trim(),updated:Date.now()};if(!entry.name)return;if(entry.cover&&!/^https:\/\//.test(entry.cover)){toast('Cover-URL muss mit https:// beginnen');return}if(entry.progress<0||entry.total<0)return;if(modal==='new')data.unshift(entry);else data=data.map(x=>x.id===modal?entry:x);persist();closeModal();render();toast('Gespeichert ✓')}else if(e.target.id==='loginForm'){
 e.preventDefault();if(!supabase){toast('Supabase nicht konfiguriert');return;}
 $('#loginMessage').textContent='Anmeldung läuft ...';
 const {data:auth,error}=await supabase.auth.signInWithPassword({email:$('#loginEmail').value.trim(),password:$('#loginPassword').value});
 if(error){$('#loginMessage').textContent=error.message;return;}
 if(auth.user?.id!==CONFIG.adminId){await supabase.auth.signOut();$('#loginMessage').textContent='Dieser Account hat keine Admin-Rechte.';return;}
 cloud={user:auth.user};closeModal();await refreshCloud();toast('Als Admin angemeldet');
 }});
$('#importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file||!isAdmin())return;try{const obj=JSON.parse(await file.text()),entries=validateEntries(Array.isArray(obj)?obj:obj.entries);if(confirm(`${entries.length} Titel importieren? Die aktuelle Collection wird ersetzt.`)){data=entries;persist();render();toast('Backup importiert ✓')}}catch(err){toast('Import fehlgeschlagen: '+err.message)}e.target.value=''});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

init();
</script></body></html>
